# snag.conf — the source of truth for snag configuration. Plain shell
# assignments; edited by `snag settings` (GUI), `snag mode`, or by hand.
# Sourced by the CLI and pipeline.sh (skip with SNAG_CONF=off when testing).
SNAG_MODE=report
SNAG_DRY_RUN=0
SNAG_CAPTURE_ROOT=
SNAG_MAX_SECONDS=600
SNAG_MAX_FRAMES=12
